<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>繁殖管理</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f8f9fa;
  }
  iframe {
    display: block;
    width: 100%;
    height: 100dvh;
    border: 0;
  }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwIZb3Zyxuu7Y-9xfTC0Chmvjuv1qX1dKWwuCj2_iH5ilIpT1gGBBskcjNg_sqk85Mk/exec" allow="fullscreen"></iframe>
<script>
  // ログイン画面からの遷移要求を受けて、トップページは動かさず iframe だけ差し替える。
  // （トップレベルで script.google.com を開くとGoogleの警告バナーが出るため）
  window.addEventListener('message', function(e) {
    var d = e.data;
    if (d && d.type === 'breeding-navigate' && typeof d.url === 'string' &&
        d.url.indexOf('https://script.google.com/') === 0) {
      if (e.source) e.source.postMessage({ type: 'breeding-wrapper-ack' }, '*');
      document.getElementById('app').src = d.url;
    }
  });
</script>
</body>
</html>
